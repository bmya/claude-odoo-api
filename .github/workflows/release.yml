name: Release image

# Publishes a multi-arch image on tag, so the server can `docker compose pull`
# instead of building. linux/amd64 for the bmya.cloud host, linux/arm64 so the
# same tag runs on Apple Silicon dev machines.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.2.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/odoo-mcp-server

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate the example key registry
      env:
        BMYA_ALLOWED_URL_SUFFIXES: .bmya.cloud,.bmya.cl
      run: |
        python tools/bmya-keys.py validate --file deploy/bmya-api-keys.example.json

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Derive image tags
      id: meta
      run: |
        REF="${{ github.event.inputs.tag || github.ref_name }}"
        echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${REF},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
        echo "Publishing ${REF} and latest"

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Summary
      run: |
        {
          echo "### Image published"
          echo
          echo '```'
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
          echo '```'
          echo
          echo "Deploy with: \`cd deploy && docker compose pull && docker compose up -d\`"
        } >> "$GITHUB_STEP_SUMMARY"
