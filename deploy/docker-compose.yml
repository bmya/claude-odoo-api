services:
  odoo-api:
    image: ${MCP_IMAGE:-ghcr.io/bmya/odoo-mcp-server:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: odoo-mcp-server
    ports:
      - "${MCP_BIND_ADDR:-10.0.0.14}:${MCP_HTTP_PORT:-8080}:8080"
    volumes:
      - "${BMYA_KEYS_HOST_DIR:-./config}:/app/config:ro"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      BMYA_AUTH_ENABLED: "${BMYA_AUTH_ENABLED:-1}"
      BMYA_API_KEYS_FILE: /app/config/bmya-api-keys.json
      BMYA_REGISTRY_TTL_SECONDS: "${BMYA_REGISTRY_TTL_SECONDS:-10}"
      BMYA_ALLOWED_URL_SUFFIXES: "${BMYA_ALLOWED_URL_SUFFIXES-.bmya.cloud,.bmya.cl}"
      BMYA_ALLOW_INSECURE_URLS: "${BMYA_ALLOW_INSECURE_URLS:-}"
      MCP_FORWARDED_ALLOW_IPS: "${TRAEFIK_HOST_IP:-127.0.0.1}"
      MCP_GATEWAY_TOKEN: "${MCP_GATEWAY_TOKEN:-}"
      ODOO_MCP_READONLY: "${ODOO_MCP_READONLY:-1}"
      # Deliberately NOT set here. "${VAR:-}" always injects the key into the
      # container, even as an empty string, and os.getenv(name, default) only
      # falls back to `default` when the key is absent -- an explicit "" means
      # "no methods at all", silently blocking every odoo_call_method call.
      # Add this line yourself with a real value only if you want to restrict
      # the built-in defaults (calendar.event.action_sync_timesheets,
      # account.move.action_post, sale.order.action_confirm).
      ODOO_REQUEST_TIMEOUT: "30"
      ODOO_MAX_RETRIES: "3"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
